name: CI
on:
  pull_request:
concurrency:
  group: cli-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  agent_docs:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test documentation classification
        run: python3 .github/scripts/test-ci-agent-docs.py
      - name: Classify inert agent documentation
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci-agent-docs.py "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  contracts:
    needs: agent_docs
    if: ${{ always() && (needs.agent_docs.result != 'success' || needs.agent_docs.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    services:
      query-postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hhc_query_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hhc_query_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HHC_QUERY_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/hhc_query_fixture?sslmode=disable
      HHC_QUERY_REQUIRE_DATABASE_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test media cache identity and integrity
        run: python3 -m unittest discover -s build -p 'test_media_cache.py'
      - name: Install media test fixtures (not the release bundle)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Test including actual CPU HLS encoding
        run: |
          HHC_TEST_FFMPEG="$(command -v ffmpeg)" \
          HHC_TEST_FFPROBE="$(command -v ffprobe)" \
          HHC_REQUIRE_MEDIA_TESTS=1 go test -race ./... -count=1
      - run: go vet ./...
      - name: Cross-compile Windows amd64 and macOS arm64 contract checks
        run: |
          GOOS=windows GOARCH=amd64 go test -c -o "$RUNNER_TEMP/media-windows.test.exe" ./internal/media
          GOOS=darwin GOARCH=arm64 go test -c -o "$RUNNER_TEMP/media-darwin.test" ./internal/media
          GOOS=windows GOARCH=amd64 go test -c -o "$RUNNER_TEMP/auth-windows.test.exe" ./internal/auth
          GOOS=darwin GOARCH=arm64 go test -c -o "$RUNNER_TEMP/auth-darwin.test" ./internal/auth
          GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/hhc.exe" ./cmd/hhc
          GOOS=darwin GOARCH=arm64 go build -o "$RUNNER_TEMP/hhc" ./cmd/hhc
  native-source:
    needs: agent_docs
    if: ${{ always() && (needs.agent_docs.result != 'success' || needs.agent_docs.outputs.docs_only != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test native source stability (not bundle or GPU acceptance)
        run: go test -race ./internal/operation -count=1
      - name: Test native operation journals and crash recovery
        run: go test -race ./internal/recordings -count=1
      - name: Test signed-update mechanics and native version switching (fixture tools)
        run: go test -race ./internal/update -count=1

      - name: Install Windows media fixtures (not the release bundle)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress
      - name: Test actual native Windows CPU preparation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mediaToolRoot = Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools'
          $mediaEncoders = @(Get-ChildItem -LiteralPath $mediaToolRoot -Filter ffmpeg.exe -File -Recurse)
          if ($mediaEncoders.Count -ne 1) { throw 'Expected one actual fixture encoder, not a Chocolatey shim' }
          $env:HHC_TEST_FFMPEG = $mediaEncoders[0].FullName
          $env:HHC_TEST_FFPROBE = Join-Path $mediaEncoders[0].DirectoryName 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $env:HHC_TEST_FFPROBE -PathType Leaf)) { throw 'Fixture probe missing' }
          $env:HHC_REQUIRE_MEDIA_TESTS = "1"
          # Hosted Windows runners have no NVIDIA GPU: verify explicit NVENC
          # failure/no fallback; the separate PrepareCPU fixtures still encode.
          $env:HHC_TEST_NO_NVENC = "1"
          go test -race ./internal/media ./internal/cli -count=1
      - name: Install macOS media fixtures (not the release bundle)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Test actual native macOS CPU preparation
        if: runner.os == 'macOS'
        run: |
          HHC_TEST_FFMPEG="$(command -v ffmpeg)" \
          HHC_TEST_FFPROBE="$(command -v ffprobe)" \
          HHC_REQUIRE_MEDIA_TESTS=1 go test -race ./internal/media ./internal/cli -count=1
      - name: Test native loopback authentication (not real browser or credential-store acceptance)
        run: go test -race ./internal/auth -count=1
      - name: Test native credential storage with disposable test entries
        env:
          HHC_TEST_NATIVE_CREDENTIALS: "1"
        run: go test -race ./internal/auth -run TestNativeCredential -count=1
      - name: Test CLI login status logout using disposable native credentials
        env:
          HHC_TEST_NATIVE_CREDENTIALS: "1"
        run: go test -race ./internal/cli -count=1
  verify:
    if: ${{ always() }}
    needs: [agent_docs, contracts, native-source]
    runs-on: ubuntu-latest
    steps:
      - name: Require contract and native platform checks
        run: |
          test "${{ needs.agent_docs.result }}" = success
          if [ "${{ needs.agent_docs.outputs.docs_only }}" = true ]; then
            test "${{ needs.contracts.result }}" = skipped
            test "${{ needs.native-source.result }}" = skipped
          else
            test "${{ needs.contracts.result }}" = success
            test "${{ needs.native-source.result }}" = success
          fi
